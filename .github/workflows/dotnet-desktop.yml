name: Build Tutu Optimizer

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\build.ps1
